name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r render-requirements.txt

      - name: Compile backend
        run: python -m py_compile server.py scripts/migrate.py scripts/seed_data.py scripts/migrate_product_images.py

      - name: Run backend tests
        run: python -m pytest tests
        env:
          SKIP_EXTERNAL_SERVICES: "1"
          SECRET_KEY: ci-secret
          DATABASE_URL: sqlite:///./ci.db
          CORS_ORIGINS: http://localhost:5173

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
